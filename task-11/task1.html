<html>
<head>
    <title>Product Information Box</title>

    <style>
        .product {
            display: inline-block;
            width: 200px;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }

        .product:hover {
            outline: 2px 
            outline-offset: 4px;
        }
    </style>
</head>

<body>

    <div class="product">
        <h3>Laptop</h3>
        <p>Good laptop for work.</p>
        <p>Price: $900</p>

    </div>

    <div class="product">
        <h3>Headphones</h3>
        <p>Clear sound quality.</p>
        <p>Price: $120</p>
        <a href="#">Buy Now</a>
    </div>

    <div class="product">
        <h3>Smartwatch</h3>
        <p>Track your daily activity.</p>
        <p>Price: $200</p>
        <a href="#">Buy Now</a>
    </div>

</body>
</html>
