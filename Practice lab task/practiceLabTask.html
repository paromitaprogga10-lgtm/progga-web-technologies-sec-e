<html>
<head>
    <title>Text Analyzer</title>
</head>
<body>

    <h2>Text Analyzer</h2>

    <textarea id="text" rows="6" cols="50" placeholder="Write something..."></textarea>
    <br><br>

    <button onclick="analyze()">Analyze Text</button>

    <br><br>

    <div id="result"></div>

    <script>
        function analyze() {

            var text = document.getElementById("text").value;

            if (text == "") {
                document.getElementById("result").innerHTML = "Please enter text!";
                return;
            }

            var charCount = text.length;

            var words = text.trim().split(" ");
            var wordCount = 0;

            for (var i = 0; i < words.length; i++) {
                if (words[i] != "") {
                    wordCount++;
                }
            }

            
            var reversed = "";
            for (var i = text.length - 1; i >= 0; i--) {
                reversed = reversed + text[i];
            }

            document.getElementById("result").innerHTML =
                "Characters: " + charCount + "<br>" +
                "Words: " + wordCount + "<br>" +
                "Reversed Text: " + reversed;
        }
    </script>

</body>
</html>
